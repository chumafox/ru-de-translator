[project]
name = "ru_de_translator"
version = "0.2.0"
description = "A terminal TUI application to translate Russian to German and pronounce it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50.0",
    "httpx>=0.25.0",
    "edge-tts>=6.1.12",
    "ctranslate2>=4.7.2",
    "transformers",
    "sentencepiece>=0.2.1",
    "sacremoses>=0.1.1",
    "qwen-tts>=0.1.1",
    "soundfile>=0.13.1",
    "mlx>=0.31.2",
    "mlx-audio>=0.2.10",
    "pydub>=0.25.1",
    "aiohttp-socks>=0.11.0",
]

[project.scripts]
ru-de-translator = "ru_de_translator.app:main"
rude = "ru_de_translator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]
